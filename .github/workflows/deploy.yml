name: Deploy to GitHub Pages

on:
  push:
    branches:
      - feat/version-2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.9.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDMl7WHQAM8PQLvoA4DJe-C83nuMLYA54M
          VITE_FIREBASE_AUTH_DOMAIN: fit-quest-8e375.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: fit-quest-8e375
          VITE_FIREBASE_STORAGE_BUCKET: fit-quest-8e375.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "122388409103"
          VITE_FIREBASE_APP_ID: "1:122388409103:web:5320b6493f84044ba4ec7a"
          VITE_FIREBASE_MEASUREMENT_ID: G-LE3SNZPQJ7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
